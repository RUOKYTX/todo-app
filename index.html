<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办清单</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <!-- ========== 未登录：登录/注册界面 ========== -->
    <section id="auth-view" class="auth-view">
      <header class="app-header">
        <h1>今日待办</h1>
      </header>
      <p class="auth-subtitle">登录后管理你的待办任务</p>

      <form id="auth-form" class="auth-form">
        <input
          type="email"
          id="auth-email"
          placeholder="邮箱"
          autocomplete="email"
          required
        >
        <input
          type="password"
          id="auth-password"
          placeholder="密码（至少 6 位）"
          autocomplete="current-password"
          minlength="6"
          required
        >
        <button type="submit" id="auth-submit-btn">登 录</button>
      </form>

      <!-- 登录/注册错误提示 -->
      <p id="auth-error" class="auth-error"></p>

      <!-- 登录/注册模式切换 -->
      <p class="auth-switch">
        <span id="auth-switch-tip">还没有账号？</span>
        <a href="#" id="auth-switch-link">注册</a>
      </p>
    </section>

    <!-- ========== 登录后：任务界面 ========== -->
    <section id="todo-view" class="todo-view">
      <header class="app-header">
        <div class="app-header-top">
          <h1>今日待办</h1>
          <div class="header-actions">
            <!-- 圆形首字头像（点击弹出个人信息菜单） -->
            <div class="avatar-wrap">
              <button id="avatar-btn" class="avatar" aria-label="个人信息">A</button>
              <!-- 个人信息下拉菜单 -->
              <div id="avatar-menu" class="avatar-menu">
                <button class="menu-item" data-action="avatar">修改头像</button>
                <button class="menu-item" data-action="password">修改密码</button>
                <button class="menu-item" data-action="logout">退出登录</button>
                <button class="menu-item" data-action="switch">切换账号</button>
                <button class="menu-item danger" data-action="delete">注销账号</button>
              </div>
            </div>
          </div>
            </div>
          </div>
        </div>
        <p id="date-text"></p>
      </header>

      <!-- 添加任务的输入区 -->
      <form id="add-form" class="add-form">
        <input
          type="text"
          id="task-input"
          placeholder="添加新的待办任务，按回车确认…"
          maxlength="100"
          autocomplete="off"
        >
        <button type="submit" id="add-btn" aria-label="添加任务">＋</button>
      </form>

      <!-- 任务统计（合并显示：共/已完成/未完成，无任务时隐藏） -->
      <p id="counter" class="counter"></p>

      <!-- 任务列表 -->
      <ul id="task-list" class="task-list"></ul>

      <!-- 空状态提示 -->
      <p id="empty-tip" class="empty-tip">暂无任务，先添加一条吧 ✨</p>
    </section>
  </main>

  <!-- 通用弹窗：修改头像 / 修改密码 / 切换账号 / 注销账号 -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <h3 id="modal-title"></h3>
      <p id="modal-desc" class="modal-desc"></p>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="modal-btn secondary">取消</button>
        <button id="modal-confirm" class="modal-btn primary">确认</button>
      </div>
    </div>
  </div>

  <!-- 轻量成功提示 -->
  <div id="toast" class="toast"></div>

  <!-- supabase-js CDN 引入（必须先于 script.js 加载） -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
